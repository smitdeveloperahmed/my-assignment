<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - Step 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: -1;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <video autoplay muted loop>
        <source src="https://videos.pexels.com/video-files/3202634/3202634-hd_1920_1080_30fps.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="box">
        <h2>Signup - Step 1</h2>
        
        <input type="text" placeholder="Full Name">
        <input type="text" placeholder="Father Name">
        
        <button onclick="location.href='signup2.html'">
            Next
        </button>
    </div>

</body>
</html>
